# render.yaml - Configuração de Implantação para Render

databases:
  - name: sistema-financeiro-db # Nome do banco de dados PostgreSQL
    databaseName: sistema_financeiro # Nome interno do banco de dados
    user: sistema_financeiro_user # Nome do usuário do banco de dados
    plan: free # Plano gratuito do Render (pode ser alterado para planos pagos)

services:
  - type: web # Serviço web para o backend FastAPI
    name: sistema-financeiro-backend
    env: python
    plan: free # Plano gratuito do Render
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      # Comando para executar migrações (se usar Alembic)
      # alembic upgrade head 
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-financeiro-db
          property: connectionString
      - key: SECRET_KEY # Chave secreta para JWT - Gerar uma chave segura!
        generateValue: true # Render gera um valor aleatório seguro
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60 # Tempo de expiração do token em minutos
      - key: BACKEND_CORS_ORIGINS # URLs do frontend permitidas (incluir URL do Render e localhost para dev)
        value: "[\"http://localhost:3000\", \"https://sistema-financeiro-frontend.onrender.com\"]" # Ajustar a URL do frontend quando implantado
    autoDeploy: true # Reimplanta automaticamente em push para o repositório Git (se conectado)
    buildFilter:
      paths:
      - backend/**

  - type: static # Serviço estático para o frontend React
    name: sistema-financeiro-frontend
    env: static
    plan: free # Plano gratuito do Render
    buildCommand: |
      # Instalar dependências (usando pnpm como no setup inicial)
      npm install -g pnpm 
      pnpm install
      # Definir a URL da API para produção
      export REACT_APP_API_BASE_URL=https://sistema-financeiro-backend.onrender.com/api # Ajustar para a URL real do backend
      # Construir o frontend
      pnpm run build
    staticPublishPath: ./build # Diretório com os arquivos estáticos após o build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # Redireciona todas as rotas para index.html (para React Router)
    autoDeploy: true # Reimplanta automaticamente em push para o repositório Git (se conectado)
    buildFilter:
      paths:
      - frontend/**

